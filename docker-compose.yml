services:

  kafka:
    image: apache/kafka:latest
    container_name: bike-kafka
    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - bike-net

  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    container_name: bike-producer

    environment:
    - BootstrapServers=kafka:9092
    - Topics__VehicleTypes=vehicle-types
    - Topics__StationStatus=station-status
    - Topics__StationInformation=station-information

    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - bike-net

  db:
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    networks:
      - bike-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    networks:
      - bike-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo mongo:27017/test --quiet 1
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - bike-net

  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    container_name: bike-consumer

    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=bike_db;User=root;Password=root;
      - ConnectionStrings__Redis=redis:6379

      - MongoDb__ConnectionString=mongodb://root:root@mongo:27017
      - MongoDb__DatabaseName=bike_db
      - MongoDb__CollectionName=station-status

      - Kafka__BootstrapServers=kafka:9092
      - Kafka__GroupId=bike-consumer-group
      - Kafka__Topics__StationInformation=station-information
      - Kafka__Topics__StationStatus=station-status
      - Kafka__Topics__VehicleTypes=vehicle-types

    depends_on:
      kafka:
        condition: service_healthy

      db:
        condition: service_healthy

      mongo:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - bike-net

networks:
  bike-net:
    driver: bridge
